[package]
name = "openless-realtime-input"
version = "0.1.0"
description = "macOS-first realtime voice input desktop app"
authors = ["AreaSongWcc"]
edition = "2021"
build = "build.rs"

[lib]
name = "openless_realtime_input_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
accessibility-sys = "0.2.0"
anyhow = "1"
arboard = "3"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
cpal = "0.16"
dirs = "6"
flate2 = "1.1.9"
futures-util = { version = "0.3.32", features = ["sink"] }
hound = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
security-framework = "3.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2.3.1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }
